name: Build ICS feeds
on:
  schedule:
    - cron: '0 * * * *'   # hourly (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install ics python-dateutil requests

      # ---- DEBUG: print config.json exactly as the runner sees it ----
      - name: Show config (debug)
        run: |
          echo "---- config.json (with line numbers) ----"
          nl -ba config.json || true
          echo "---- hidden characters (cat -A) ----"
          cat -A config.json || true
          echo "---- repo listing ----"
          ls -la
          echo "---- CSV preview ----"
          head -n 5 schedule_template.csv || true
          echo "------------------------------------------------"

      # ---- Generate the ICS files ----
      - name: Generate feeds
        run: python gen_ics.py

      # ---- Commit any changed .ics files in docs/feeds ----
      - name: Commit changes if any
        run: |
          if
