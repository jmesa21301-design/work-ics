name: Build ICS feeds
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'   # hourly (UTC)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install "ics==0.7.2" python-dateutil requests

      - name: Generate feeds
        run: python gen_ics.py

      - name: Show outputs
        run: |
          echo "::group::ls docs/feeds"
          ls -la docs/feeds || true
          echo "::endgroup::"
          echo "::group::preview ICS"
          for f in docs/feeds/*.ics; do
            [ -f "$f" ] && { echo "---- $f ----"; head -n 5 "$f"; }
          done
          echo "::endgroup::"
          echo "::group::check-ignore"
          git check-ignore -v docs/feeds/*.ics || echo "No .ics*
